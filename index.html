<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Geek — Платформа нового поколения для связи и комьюнити</title>
    <meta
      name="description"
      content="Самый мощный аналог Discord для геймеров, разработчиков и креативных комьюнити. Кристально чистый P2P-голос, чаты и приватность."
    />
    <meta property="og:title" content="Geek — Платформа нового поколения для связи и комьюнити" />
    <meta
      property="og:description"
      content="Самый мощный аналог Discord для геймеров, разработчиков и креативных комьюнити."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0714" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Geek" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #0b0714;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body class="bg-[#0b0714] text-slate-200 antialiased selection:bg-[#ff007f] selection:text-white">
    <div id="root"></div>
    <noscript>
      <div style="padding:32px;text-align:center;font-family:system-ui,sans-serif;color:#e2e8f0;background:#0b0714;">
        Для работы платформы <strong>Geek</strong> необходимо включить JavaScript в браузере.
      </div>
    </noscript>
    <!-- HOST0_ROOT_FALLBACK_START -->
    <script>
      (function () {
        var started = false;
        function bootCompiledSite() {
          if (started || window.__GEEK_REACT_MOUNTED__) return;
          started = true;
          fetch('./site/manifest.json', { cache: 'no-store' })
            .then(function (r) {
              if (!r.ok) throw new Error('MANIFEST_HTTP_' + r.status);
              return r.json();
            })
            .then(function (m) {
              if (window.__GEEK_REACT_MOUNTED__) return;
              if (m && m.css) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = './site/' + m.css;
                document.head.appendChild(link);
              }
              if (m && m.js) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = './site/' + m.js;
                document.head.appendChild(script);
              }
            })
            .catch(function () {
              if (window.__GEEK_REACT_MOUNTED__) return;
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './site/assets/app.css';
              document.head.appendChild(link);
              var script = document.createElement('script');
              script.type = 'module';
              script.src = './site/assets/app.js';
              script.onerror = function () {
                if (window.__GEEK_REACT_MOUNTED__) return;
                var root = document.getElementById('root');
                if (root && !root.innerHTML.trim()) {
                  root.innerHTML =
                    '<div style="max-width:560px;margin:80px auto;padding:28px;border:1px solid rgba(0,240,255,0.35);border-radius:14px;background:#0f0b1d;font-family:system-ui,sans-serif;color:#e2e8f0;line-height:1.55;">' +
                    '<h1 style="margin:0 0 12px;font-size:20px;color:#00f0ff;">Geek — Не найдена папка сборки (site/)</h1>' +
                    '<p style="margin:0 0 10px;">На хостинг загружен исходный <code>index.html</code> без скомпилированной папки <code>site/</code> (или <code>dist/</code>).</p>' +
                    '<p style="margin:0;color:#94a3b8;font-size:14px;">Загрузите либо весь архив проекта целиком (включая папку <code>site/</code> и файл <code>index.php</code>), либо только содержимое папки <code>site/</code> в корень домена.</p>' +
                    '</div>';
                }
              };
              document.head.appendChild(script);
            });
        }
        window.__GEEK_BOOT_SITE__ = bootCompiledSite;
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            if (!window.__GEEK_REACT_MOUNTED__) bootCompiledSite();
          }, 1200);
        });
      })();
    </script>
    <!-- HOST0_ROOT_FALLBACK_END -->
    <script>
      (function () {
        var bootErr = '';
        window.addEventListener('error', function (ev) {
          if (!window.__GEEK_REACT_MOUNTED__) {
            var targetSrc = ev && ev.target && (ev.target.src || ev.target.href);
            bootErr = targetSrc
              ? 'Не удалось загрузить файл: ' + targetSrc
              : (ev && ev.message) || 'Ошибка запуска скрипта';
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          if (!window.__GEEK_REACT_MOUNTED__ && !bootErr) {
            bootErr = String((ev && ev.reason && ev.reason.message) || (ev && ev.reason) || 'Ошибка загрузки модуля');
          }
        });
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            if (window.__GEEK_REACT_MOUNTED__) return;
            var root = document.getElementById('root');
            if (!root || root.innerHTML.trim()) return;
            root.innerHTML =
              '<div style="max-width:560px;margin:72px auto;padding:24px;border:1px solid rgba(0,240,255,0.35);border-radius:14px;background:#0f0b1d;font-family:system-ui,sans-serif;color:#e2e8f0;line-height:1.55;">' +
              '<h1 style="margin:0 0 10px;font-size:19px;color:#00f0ff;">Geek — Интерфейс не загрузился</h1>' +
              '<p style="margin:0 0 10px;font-size:14px;">Скрипт интерфейса не смог запуститься. Убедитесь, что папка <code>site/assets/</code> загружена на хостинг целиком, и обновите страницу (<code>Ctrl+F5</code>).</p>' +
              (bootErr
                ? '<p style="margin:0 0 12px;padding:8px 10px;border-radius:8px;background:#050814;border:1px solid rgba(255,42,133,0.35);color:#ff80a0;font-family:monospace;font-size:12px;word-break:break-all;"></p>'
                : '') +
              '<button type="button" id="geek-hard-reload-btn" style="padding:8px 14px;border-radius:8px;border:1px solid #00f0ff;background:rgba(0,240,255,0.15);color:#fff;font-weight:700;cursor:pointer;">Очистить кэш и обновить</button>' +
              '</div>';
            if (bootErr) {
              var errBox = root.querySelector('p[style*="monospace"]');
              if (errBox) errBox.textContent = bootErr;
            }
            var btn = document.getElementById('geek-hard-reload-btn');
            if (btn) {
              btn.addEventListener('click', function () {
                var tasks = [];
                if ('caches' in window) {
                  tasks.push(
                    caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    }).catch(function () {})
                  );
                }
                if ('serviceWorker' in navigator) {
                  tasks.push(
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    }).catch(function () {})
                  );
                }
                Promise.all(tasks).finally(function () {
                  location.reload();
                });
              });
            }
          }, 3500);
        });
      })();
    </script>
    <script
      type="module"
      src="/src/main.tsx"
      onerror="window.__GEEK_BOOT_SITE__ && window.__GEEK_BOOT_SITE__()"
    ></script>
  </body>
</html>
